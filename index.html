<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel = "stylesheet" href = "./styles/index.css">
    <title>Calculatrice</title>
</head>
<body>
    <header>
        <div class = "hdiv">
            <h1 class ="hh1">Calculatrice</h1>
            <nav class="hnav">
                <button class ="hbg">Clair</button>
            </nav>
        </div>
    </header>
    <body>
        <main>
            <div class="ecran">
                <h2>0</h2>
            </div>
                
                <div class = "clavier">
                    <!-- bouton chiffre -->
                    <button class="btnnb">1</button>
                    <button class="btnnb">2</button>
                    <button class="btnnb">3</button>
                    <button class="btnnb">4</button>
                    <button class="btnnb">5</button>
                    <button class="btnnb">6</button>
                    <button class="btnnb">7</button>
                    <button class="btnnb">8</button>
                    <button class="btnnb">9</button>
                    <button class="btnnb">0</button>
                    
                    <!-- bouton op -->
                    <button class="btnop">+</button>
                    <button class="btnop">-</button>
                    <button class="btnop">x</button>
                    <button class="btnop">/</button>
                    <button class="btnop">%</button>
                    <button class="btnop">=</button>

                    <!-- ctrl -->
                    <button class="btnctrl"><=</button>
                    <button class="btnreset">Reset</button>
            </div>
        </main>

        <footer>
            <div class = "footer">
                <img class="logo" src = "./img/Logo-RI.png">
            </div>
        </footer>
    </body>


    <script src = "./js/index.js"></script>
</body>
</html>
